<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Job-Loop：基于大模型的个性化求职系统</title><desc id="desc">连接个人档案、岗位评估、投递管理与面试成长的求职工作台。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c3d"/><stop offset="1" stop-color="#203e84"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#5089ff"/><stop offset="1" stop-color="#8e8bff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs>
<rect width="1440" height="520" rx="24" fill="url(#bg)"/><rect width="1440" height="520" rx="24" fill="url(#grid)"/>
<circle cx="1360" cy="30" r="265" fill="#6d77ff" opacity=".10"/><circle cx="1130" cy="460" r="230" fill="#3dc7ca" opacity=".05"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif">
<rect x="64" y="57" width="40" height="40" rx="12" fill="url(#blue)"/><path d="M75 72h18v13H75zm5 0v-4h8v4" fill="none" stroke="white" stroke-width="2"/><text x="119" y="84" font-size="15" font-weight="600" fill="#a9c2ff" letter-spacing="3">YOUR CAREER, CONNECTED</text>
<text x="64" y="180" fill="white" font-size="70" font-weight="750" letter-spacing="-2">Job-Loop</text>
<text x="67" y="236" fill="#e5ecff" font-size="30" font-weight="600">基于大模型的个性化求职系统</text>
<text x="68" y="289" fill="#aec0e4" font-size="19">让每一次投递有依据，让每一场面试有积累。</text>
<g font-size="14" fill="#e4ecff"><rect x="68" y="330" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".09"/><text x="86" y="352">个性化匹配</text><rect x="198" y="330" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".09"/><text x="216" y="352">结构化评估</text><rect x="328" y="330" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".09"/><text x="346" y="352">面试与复盘</text></g>
<text x="68" y="452" fill="#92aad4" font-size="14" letter-spacing="2">PROFILE / MATCH / APPLY / INTERVIEW / GROW</text>
<g transform="translate(815 74)"><rect width="554" height="368" rx="18" fill="#0e1933" stroke="#7799dc" stroke-opacity=".35"/><rect x="1" y="1" width="552" height="45" rx="17" fill="#ffffff" fill-opacity=".04"/><circle cx="23" cy="23" r="4" fill="#ff8c95"/><circle cx="39" cy="23" r="4" fill="#f8d182"/><circle cx="55" cy="23" r="4" fill="#67d3b0"/><text x="83" y="28" fill="#b2c6ec" font-size="12" letter-spacing="2">THE JOB LOOP</text>
<path d="M110 116H430V277H110Z" stroke="#567bbe" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<g fill="#172a50" stroke="#375b96"><rect x="28" y="81" width="148" height="73" rx="12"/><rect x="203" y="81" width="148" height="73" rx="12"/><rect x="378" y="81" width="148" height="73" rx="12"/><rect x="28" y="239" width="148" height="73" rx="12"/><rect x="203" y="239" width="148" height="73" rx="12"/><rect x="378" y="239" width="148" height="73" rx="12"/></g>
<g fill="#dce7ff" text-anchor="middle" font-size="18" font-weight="600"><text x="102" y="124">个人档案</text><text x="277" y="124">岗位匹配</text><text x="452" y="124">投递管理</text><text x="452" y="282">面试准备</text><text x="277" y="282">面试复盘</text><text x="102" y="282">技能提升</text></g>
<rect x="165" y="176" width="224" height="42" rx="21" fill="url(#blue)"/><text x="277" y="203" fill="white" text-anchor="middle" font-size="15" font-weight="600">以个人经历为起点，持续改进</text>
